<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Phone Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon-container {
      width: 56px;
      height: 56px;
      background: rgba(37, 99, 235, 0.15);
      color: #3b82f6;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 1rem;
      color: #ffffff;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <h1 class="title">Web Phone Login</h1>
      <p class="subtitle">Enter your details to launch the dialer</p>
    </div>

    <form id="phoneLoginForm">
      <div class="form-group">
        <label for="extension">Extension / Username</label>
        <input type="text" id="extension" placeholder="e.g. 112" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit">Launch Web Phone</button>
    </form>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Configuration — edit these two values to repoint the dialer.
    // ---------------------------------------------------------------
    const CONFIG = {
      // SIP / PBX server handed to the webphone (host:port)
      serverAddress: '139.84.175.21:65236',
      // Hosted softphone page the form hands off to
      baseUrl: 'https://www.webvoipphone.com/webphone_online_demo/softphone.html'
    };

    document.getElementById('phoneLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const extension = document.getElementById('extension').value.trim();
      const password = document.getElementById('password').value;

      // Construct target URL with URL encoding for password safety
      const targetUrl = `${CONFIG.baseUrl}?wp_serveraddress=${encodeURIComponent(CONFIG.serverAddress)}&wp_username=${encodeURIComponent(extension)}&wp_password=${encodeURIComponent(password)}#page_dialpad`;

      // Redirect user to webphone
      window.location.href = targetUrl;
    });
  </script>

</body>
</html>
